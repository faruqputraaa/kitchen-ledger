# docker-compose.yml - Client & Server only (MongoDB external)
# Build context: root (workspace caching)
# Networks: external (caddy)

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    command:
      - mongod
      - --bind_ip_all
      - --replSet
      - rs0
      - --keyFile
      - /data/configdb/keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: adminhost123
    volumes:
      - mongodb_data:/data/db
      - ./keyfile:/data/configdb/keyfile
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - app-network

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: kl-server
    restart: unless-stopped
    env_file:
      - ../server/.env
    ports:
      - "5000:5000"
    volumes:
      - /opt/logs/kitchen-ledger:/app/src/logs
    networks:
      - app-network
    depends_on:
      - mongodb

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: kl-client
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - app-network

