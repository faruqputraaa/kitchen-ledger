# docker-compose.yml
services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: kl-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://localhost:27018/kitchen_ledger
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - CLIENT_URL=https://yourdomain.com
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    ports:
      - "5000:5000"   # Expose ke host untuk Caddy proxy
    networks:
      - kl-internal
    depends_on:
      - mongodb

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    container_name: kl-client
    restart: unless-stopped
    # NO ports - Caddy serve static files dari host
    volumes:
      - ../client/dist:/usr/share/nginx/html  # Share build ke host
    networks:
      - kl-internal

networks:
  kl-internal:
    driver: bridge

volumes:
  mongodb_data:
