# docker-compose.yml - Core services only
# Build context: root (workspace caching)
# Networks: internal (db) + external (caddy)

services:
  mongodb:
    image: mongo:7
    container_name: kl-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=kitchen-ledger-db
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - kl-internal
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/kitchen-ledger-db --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: kl-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - /opt/logs/kitchen-ledger:/app/server/src/logs
    networks:
      - kl-internal
      - kl-network
    depends_on:
      mongodb:
        condition: service_healthy

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    container_name: kl-client
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - kl-network

networks:
  kl-internal:
    driver: bridge
  kl-network:
    external: true

volumes:
  mongodb_data: