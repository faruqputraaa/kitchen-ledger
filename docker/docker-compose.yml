# docker-compose.yml - Client & Server only (MongoDB external)
# Build context: root (workspace caching)
# Networks: external (caddy)

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: kl-server
    restart: unless-stopped
    env_file:
      - ../server/.env
    ports:
      - "5000:5000"
    volumes:
      - /opt/logs/kitchen-ledger:/app/src/logs
    networks:
      - kl-network

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: kl-client
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - kl-network

networks:
  kl-network:
    external: true