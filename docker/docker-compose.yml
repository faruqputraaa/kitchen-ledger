services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile

    container_name: kl-server

    restart: unless-stopped

    env_file:
      - ../server/.env

    ports:
      - "5000:5000"

    volumes:
      - /opt/logs/kitchen-ledger:/app/src/logs

    networks:
      - kl-network

  client:
    build:
      context: ..
      dockerfile: client/Dockerfile

    container_name: kl-client

    restart: unless-stopped

    depends_on:
      - server

    ports:
      - "3000:80"

    networks:
      - kl-network

networks:
  kl-network:
    external: true